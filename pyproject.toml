[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronomech"
version = "1.0.0"
description = "A mechanical, HUD-styled multi-function desktop clock (PySide6)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "psutil>=5.9", "tzdata>=2024.1"]

[project.gui-scripts]
chronomech = "chronomech.app:main"

[tool.setuptools.packages.find]
include = ["chronomech*"]
